name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        run: npm ci

      - name: Bump version from tag
        shell: bash
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          npm pkg set version="$VER"
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$VER\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VER\"/" src-tauri/Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TTLI ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
