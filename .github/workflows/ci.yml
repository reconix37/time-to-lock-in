name: CI

on:
  pull_request:
  push:
    branches: [main, 'fix/**']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:icons
      - run: node --test tests/classification.test.mjs tests/duration.test.mjs tests/i18n.test.mjs tests/miniSettings.test.mjs tests/miniVerdict.test.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --bundles nsis --config src-tauri/tauri.ci.conf.json --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Time-To-Lock-In-Windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
